<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页间｜遇见在文字之间</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>页间 <small>遇见在文字之间</small></header>

<div class="toolbar">
<button onclick="setTheme('day')">☀️ 白天</button>
<button onclick="setTheme('night')">🌙 夜晚</button>
<button onclick="setTheme('paper')">📖 羊皮纸</button>
</div>

<main>
<h1>我的书架</h1>

<div class="card">
<h2>导入你的书</h2>
<p>支持 TXT 文本书籍（电子书上传后保存在本地浏览器）</p>
<input type="file" id="bookUpload" accept=".txt">
<button onclick="loadBook()">开始阅读</button>
</div>

<div class="card">
<h2 id="bookTitle">在文字之间</h2>
<div id="content">请选择一本书开始阅读。</div>
</div>

<div class="card">
<h2>✨ AI陪读设置</h2>
<select>
<option>温柔陪伴</option>
<option>知性学者</option>
<option>幽默朋友</option>
<option>安静倾听者</option>
</select>
<input placeholder="AI称呼你为……">
</div>

<div class="card">
<h2>📝 批注收藏</h2>
<textarea placeholder="记录你的想法"></textarea>
</div>
</main>

<script src="js/app.js"></script>
</body>
</html>
